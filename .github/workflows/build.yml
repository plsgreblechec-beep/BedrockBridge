name: Build APK with Go

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24' # <-- ВАЖНО: обновили версию

    - name: Fix Android NDK version
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Build Go Library
      run: |
        mkdir -p app/libs
        cd go-core
        go mod tidy
        go install golang.org/x/mobile/cmd/gomobile@latest
        go get golang.org/x/mobile/bind
        gomobile init
        gomobile bind -target=android -androidapi 21 -o ../app/libs/bridge.aar .

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2

    - name: Build APK
      run: gradle :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BedrockBridge-APK
        path: "**/*.apk"
