name: Build APK with Go

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Fix Android NDK version
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Build Go Library
      run: |
        mkdir -p app/libs
        cd go-core
        go mod tidy
        go install golang.org/x/mobile/cmd/gomobile@latest
        go get golang.org/x/mobile/bind
        gomobile init
        gomobile bind -target=android -androidapi 21 -o ../app/libs/bridge.aar .

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    # ВОТ ГЛАВНОЕ ИЗМЕНЕНИЕ: Мы явно скачиваем gradle-wrapper.jar перед сборкой
    - name: Download gradle wrapper jar
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BedrockBridge-APK
        path: app/build/outputs/apk/debug/app-debug.apk
