name: Build APK with Go

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build Go Library
      run: |
        cd go-core
        go mod tidy
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20231108233038-3b5cc5b02f9a
        gomobile init
        gomobile bind -target=android -o ../app/libs/bridge.aar .

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BedrockBridge-APK
        path: app/build/outputs/apk/debug/app-debug.apk
